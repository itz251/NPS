<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Navayerusalem Prarthana Sabha Foundation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Lightbox Modal CSS */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 85%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover {
            color: #f39c12;
        }
        .gallery-item {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo"><i class="fa-solid fa-church text-amber-400 text-xl"></i>  Navayerusalem Foundation</a>
        <div class="menu-toggle" onclick="toggleMenu()"><i class="fa fa-bars"></i></div>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html" style="color: #f39c12;">Gallery</a></li>
            <li><a href="contact.html">Contact Us</a></li>
             <li><a href="about.html">About Us</a></li>
            <li><a href="admin.html"><i class="fa fa-lock"></i> Admin</a></li>
        </ul>
    </nav>

    <div class="section">
        <h2 class="section-title">Church Photo & Video Gallery</h2>
        <div id="full-gallery-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
            <!-- Dynamic Photos and Videos will load here -->
        </div>
    </div>

    <!-- Lightbox Modal for Zooming Pictures -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg">
    </div>

    <footer>
        <p>&copy; 2026 Navayerusalem Prarthana Sabha Foundation. All rights reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('nav-links').classList.toggle('show');
        }

        document.addEventListener("DOMContentLoaded", function() {
           // fetch('http://localhost:3000/api/gallery')
            fetch('/api/gallery')
                .then(res => res.json())
                .then(gallery => {
                    let container = document.getElementById('full-gallery-container');
                    container.innerHTML = '';
                    if(gallery.length === 0) {
                        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Abhi koi photo ya video uplabdh nahi hai.</p>';
                        return;
                    }
                    gallery.forEach(item => {
                        if (item.type === 'video') {
                            container.innerHTML += `
                                <div style="height: 220px; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                                    <iframe src="${item.url}" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>
                                </div>
                            `;
                        } else {
                            container.innerHTML += `
                                <div class="gallery-item" onclick="openModal('${item.url}')" style="height: 220px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                                    <img src="${item.url}" alt="Church Gallery Item" style="width:100%; height:100%; object-fit:cover;">
                                </div>
                            `;
                        }
                    });
                });
        });

        // Open Modal Function
        function openModal(url) {
            let modal = document.getElementById('imageModal');
            let modalImg = document.getElementById('modalImg');
            modal.style.display = "block";
            modalImg.src = url;
        }

        // Close Modal Function
        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }
    </script>
</body>
</html>
